name: iPhone app (unsigned .ipa)

# Every push to main builds the iPhone app from the same web code as the Android app.
# The Xcode project is generated fresh here (npx cap add ios), so nothing iOS-specific lives in the repo.
# The .ipa is unsigned: install it with Sideloadly / AltStore, or sign it once the Apple Developer
# account is set up (App Store / TestFlight needs that account).
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Supabase settings
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$URL" ] && [ -n "$KEY" ]; then
            echo "VITE_SUPABASE_URL=$URL" > .env.production.local
            echo "VITE_SUPABASE_ANON_KEY=$KEY" >> .env.production.local
          fi
          grep -q '^VITE_SUPABASE_URL=https://' .env.production || { echo "::error::.env.production is missing VITE_SUPABASE_URL"; exit 1; }

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Create the Xcode project
        run: npx cap add ios

      - name: App name, version and sign-in link
        run: |
          PL=ios/App/App/Info.plist
          V="0.6.0"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; fi
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName MedNotes" "$PL"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $V" "$PL" || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $V" "$PL"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" "$PL" || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $GITHUB_RUN_NUMBER" "$PL"
          # Google / Facebook sign-in comes back through com.mednotes.elibrary://auth-callback
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PL"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PL"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PL"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string com.mednotes.elibrary" "$PL"
          # needed by "Save image" for receipts
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string MedNotes saves your receipts to Photos." "$PL"

      - name: App icon
        continue-on-error: true
        run: |
          mkdir -p assets
          sips -z 1024 1024 design/logo-blue.png --out assets/icon-only.png
          npx --yes @capacitor/assets@3 generate --ios --iconBackgroundColor '#ffffff' --splashBackgroundColor '#ffffff'

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -40
          test -d build/Build/Products/Release-iphoneos/App.app

      - name: Package .ipa
        run: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/App.app out/Payload/MedNotes.app
          (cd out && zip -qr "MedNotes-${GITHUB_REF_NAME//\//-}-unsigned.ipa" Payload && rm -rf Payload)
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: mednotes-ios
          path: out/*.ipa

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: MedNotes ${{ github.ref_name }}
          files: out/*.ipa
