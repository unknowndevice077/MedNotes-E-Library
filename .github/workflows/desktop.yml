name: Desktop app (Windows .exe / Mac .dmg)

# Every push to main builds the Windows installer + portable .exe and the Mac .dmg
# (downloadable from the run's artifacts). A version tag (v*) also attaches them to the GitHub Release.
# The builds are unsigned: Windows shows "Windows protected your PC" → More info → Run anyway;
# on a Mac, right-click the app → Open the first time.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            files: desktop/release/*.exe
          - os: macos-14
            target: mac
            files: desktop/release/*.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: mednotes-${{ matrix.target }}
          path: ${{ matrix.files }}

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: MedNotes ${{ github.ref_name }}
          files: ${{ matrix.files }}
