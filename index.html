<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0284C7" />
    <meta name="description" content="MedNotes E-Library: medical notes, e-books, lectures and slides. Preview free, unlock when you're ready." />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>MedNotes E-Library</title>
    <style>html[data-dark] { background: #0b1220; color-scheme: dark; }</style>
    <script>
      // dark mode before anything paints, so a fresh visit doesn't flash white while the app loads
      try {
        var admin = /\/admin(\/|$)/.test(location.pathname);
        var m = localStorage.getItem(admin ? 'mn.admin-dark' : 'mn.app-theme');
        var dark = admin ? m === '1' : m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) { document.documentElement.setAttribute('data-dark', ''); }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
